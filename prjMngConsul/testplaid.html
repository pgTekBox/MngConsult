<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Plaid POST</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background: #10b981;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

            .btn:hover {
                background: #059669;
            }

        #result {
            margin-top: 20px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>Test appel PlaidCreateLinkToken.aspx</h2>

    <button class="btn" onclick="testPost()">Tester POST</button>
    <pre id="out"></pre>
    <div id="result">Résultat ici...</div>

    <script>
        async function testPlaid() {
            try {
                document.getElementById("result").innerText = "Envoi requête...";

                const res = await fetch('/PlaidCreateLinkToken.aspx', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                const text = await res.text();

                document.getElementById("result").innerText =
                    "Status: " + res.status + "\n\n" + text;

            } catch (err) {
                document.getElementById("result").innerText =
                    "Erreur: " + err.message;
                console.error(err);
            }
        }


        async function testPost() {
            try {
                const res = await fetch('/PlaidCreateLinkToken.aspx', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                    redirect: 'manual'
                });

                document.getElementById('out').textContent =
                    'status=' + res.status + '\n' +
                    'type=' + res.type + '\n' +
                    'url=' + res.url;
            } catch (e) {
                document.getElementById('out').textContent = e.message;
            }
        }


    </script>

</body>
</html>
