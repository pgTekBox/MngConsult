<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau RDV</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1f3d;
    --blue: #1d4f91;
    --blue-soft: #e6eef9;
    --blue-btn: #8aa8d6;
    --green: #3fb27f;
    --text: #1b2433;
    --muted: #6b7486;
    --border: #c9d1de;
    --panel: #f3f5f9;
    --gold: #8a5a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Nunito", system-ui, sans-serif; color: var(--text);
    background: rgba(15, 31, 61, .45);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    width: 1040px; max-width: 100%;
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    display: flex; flex-direction: column;
  }

  /* En-tête */
  .head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 22px; border-bottom: 1px solid #e3e7ee;
  }
  .head-icon {
    width: 44px; height: 44px; border-radius: 12px; background: var(--blue-soft);
    display: grid; place-items: center; color: var(--blue);
  }
  .head h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .head .sub { font-size: 13px; color: var(--muted); }
  .head .spacer { flex: 1; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: #fff; border-radius: 999px;
    padding: 9px 16px; font: 700 13px inherit; font-family: inherit; color: var(--text); cursor: pointer;
  }
  .btn-close {
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: #e9edf3; font-size: 18px; font-weight: 800; cursor: pointer;
  }

  /* Corps */
  .body { display: grid; grid-template-columns: 1fr 344px; min-height: 580px; }
  .main { padding: 18px 22px 22px; }
  .side { background: var(--panel); border-left: 1px solid #e3e7ee; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }

  .step { margin-bottom: 14px; }
  .step-title { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .badge {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px;
    background: var(--blue);
  }
  .badge.done { background: var(--green); }
  .step-body { margin-left: 42px; }

  select {
    width: 100%; height: 46px; padding: 0 16px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    font: 700 16px "Nunito", sans-serif; color: var(--text);
  }
  select:focus { outline: none; border: 2px solid var(--blue); }

  .lieu { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .lieu-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 4px; }
  .chip {
    border: 1px solid var(--border); background: #fff; border-radius: 999px;
    padding: 7px 12px; font: 700 13px "Nunito", sans-serif; color: var(--text); cursor: pointer;
  }
  .chip.on { background: var(--blue-soft); border-color: var(--blue); }

  .days { display: flex; gap: 8px; margin: 10px 0 12px; flex-wrap: wrap; }
  .day {
    width: 112px; padding: 8px 0; border-radius: 10px; text-align: center; cursor: pointer;
    border: 1px solid var(--border); background: #fff; line-height: 1.15;
  }
  .day .d1 { font-size: 12px; font-weight: 700; }
  .day .d2 { font-size: 20px; font-weight: 800; }
  .day .d3 { font-size: 11px; font-weight: 700; }
  .day.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  .period { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 4px 0 6px; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .slot {
    height: 44px; border: 1px solid var(--border); border-radius: 10px; background: #fff;
    font: 800 15px "Nunito", sans-serif; color: var(--text); cursor: pointer;
  }
  .slot:hover { border-color: var(--blue); }
  .slot.on { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Résumé */
  .side-title { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .card { background: #fff; border-radius: 14px; padding: 14px; }
  .sum-name { font-size: 18px; font-weight: 800; }
  .sum-svc { font-size: 13px; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid #e3e7ee; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .row-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
  .row-k { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  .row-v { font-size: 14px; font-weight: 700; }
  .row-v.pending { color: var(--gold); }
  .check { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 14px; }
  .check input { width: 22px; height: 22px; accent-color: var(--blue); }
  textarea {
    width: 100%; min-height: 62px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; font: 14px "Nunito", sans-serif;
  }
  .side .spacer { flex: 1; }
  .cta {
    width: 100%; height: 64px; border: 0; border-radius: 999px;
    background: var(--blue-btn); color: #fff; font: 800 26px "Nunito", sans-serif; cursor: not-allowed;
  }
  .cta.ready { background: var(--blue); cursor: pointer; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    .body { grid-template-columns: 1fr; }
    .side { border-left: 0; border-top: 1px solid #e3e7ee; }
    .slots { grid-template-columns: repeat(3, 1fr); }
    .step-body { margin-left: 0; }
    .head .btn-ghost span { display: none; }
  }
</style>
</head>
<body>
<div class="modal" role="dialog" aria-labelledby="t">
  <div class="head">
    <div class="head-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M10 15h4M12 13v4"/></svg>
    </div>
    <div>
      <h1 id="t">Nouveau RDV</h1>
      <div class="sub">Soins et santé · seul · 9 h à 19 h</div>
    </div>
    <div class="spacer"></div>
    <button class="btn-ghost">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 18h4M12 18h8M14 4v4M8 16v4"/></svg>
      <span>Adapter l'agenda</span>
    </button>
    <button class="btn-close" aria-label="Fermer">×</button>
  </div>

  <div class="body">
    <div class="main">
      <div class="step">
        <div class="step-title"><span class="badge done" id="b1">✓</span>Pour quel client ?</div>
        <div class="step-body">
          <select id="client">
            <option>Lise Ouellet</option>
            <option>Marc Tremblay</option>
            <option>Julie Gagnon</option>
          </select>
        </div>
      </div>

      <div class="step">
        <div class="step-title"><span class="badge done" id="b2">✓</span>Quel service ?</div>
        <div class="step-body">
          <select id="service">
            <option data-dur="60" data-price="95">Massage suédois 60 min · 1 h · 95 $/h</option>
            <option data-dur="90" data-price="130">Massage suédois 90 min · 1 h 30 · 130 $</option>
            <option data-dur="30" data-price="55">Consultation · 30 min · 55 $</option>
          </select>
          <div class="lieu">
            <span class="lieu-label">Lieu</span>
            <button class="chip" data-lieu="Chez le client">Chez le client</button>
            <button class="chip" data-lieu="À votre place d'affaires">À votre place d'affaires</button>
            <button class="chip on" data-lieu="À distance">À distance</button>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-title"><span class="badge" id="b3">3</span>Quand ?</div>
        <div class="step-body">
          <select id="semaine">
            <option>Cette semaine · 12 au 16 oct. · 9 plages libres</option>
            <option>Semaine prochaine · 19 au 23 oct. · 24 plages libres</option>
          </select>
          <div class="days" id="days"></div>
          <div class="period">Après-midi</div>
          <div class="slots" id="slots"></div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="side-title">RÉSUMÉ</div>
      <div class="card">
        <div class="sum-name" id="sName">Lise Ouellet</div>
        <div class="sum-svc" id="sSvc">Massage suédois 60 min · 1 h</div>
        <div class="row">
          <div class="row-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></div>
          <div><div class="row-k">Quand</div><div class="row-v pending" id="sWhen">Choisissez une plage</div></div>
        </div>
        <div class="row">
          <div class="row-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
          <div><div class="row-k">Lieu</div><div class="row-v" id="sLieu">À distance</div></div>
        </div>
        <div class="row">
          <div class="row-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></div>
          <div><div class="row-k">Montant prévu</div><div class="row-v" id="sPrice">95,00 $ avant taxes</div></div>
        </div>
      </div>

      <label class="card check"><input type="checkbox" checked> Texto de rappel 24 h avant</label>
      <textarea placeholder="Note pour le RDV (facultatif)"></textarea>

      <div class="spacer"></div>
      <button class="cta" id="cta" disabled>Choisissez une plage</button>
      <div class="hint" id="hint">Il reste à choisir une plage.</div>
    </aside>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const days = [{ lbl: 'Auj.', n: 16, free: 9 }];
  const times = ['16 h','16 h 15','16 h 30','16 h 45','17 h','17 h 15','17 h 30','17 h 45','18 h'];
  let day = days[0], slot = null;

  days.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'day' + (i === 0 ? ' on' : '');
    b.innerHTML = `<div class="d1">${d.lbl}</div><div class="d2">${d.n}</div><div class="d3">${d.free} libres</div>`;
    b.onclick = () => { document.querySelectorAll('.day').forEach(x => x.classList.remove('on')); b.classList.add('on'); day = d; update(); };
    $('days').appendChild(b);
  });

  times.forEach(t => {
    const b = document.createElement('button');
    b.className = 'slot'; b.textContent = t;
    b.onclick = () => { document.querySelectorAll('.slot').forEach(x => x.classList.remove('on')); b.classList.add('on'); slot = t; update(); };
    $('slots').appendChild(b);
  });

  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); $('sLieu').textContent = c.dataset.lieu;
  });

  $('client').onchange = update;
  $('service').onchange = update;

  function update() {
    const opt = $('service').selectedOptions[0];
    $('sName').textContent = $('client').value;
    $('sSvc').textContent = opt.textContent.split(' · ').slice(0, 2).join(' · ');
    $('sPrice').textContent = Number(opt.dataset.price).toFixed(2).replace('.', ',') + ' $ avant taxes';
    const w = $('sWhen'), cta = $('cta');
    if (slot) {
      w.textContent = `${day.lbl === 'Auj.' ? "Aujourd'hui" : day.lbl} ${day.n} oct. · ${slot}`;
      w.classList.remove('pending');
      $('b3').textContent = '✓'; $('b3').classList.add('done');
      cta.textContent = 'Confirmer le RDV'; cta.disabled = false; cta.classList.add('ready');
      $('hint').textContent = 'Tout est prêt.';
    }
  }
</script>
</body>
</html>
